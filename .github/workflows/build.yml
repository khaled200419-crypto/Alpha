name: Build Alpha APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Files
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Create All Project Files Automatically
        run: |
          mkdir -p app/src/main/java/com/alpha/status
          mkdir -p app/src/main/res/drawable

          # إذا قمت برفع صورة باسم icon.png سيعتمدها كأيقونة للتطبيق تلقائياً
          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/drawable/ic_launcher.png
          elif [ -f "icon.jpg" ]; then
            cp icon.jpg app/src/main/res/drawable/ic_launcher.jpg
          else
            cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#16A34A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,28L30,80h11l5,-12h16l5,12h11L54,28zM49.5,58L54,47l4.5,11H49.5z"/>
          </vector>
          EOF
          fi

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AlphaStatus"
          include ':app'
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2'
          }
          android {
              namespace 'com.alpha.status'
              compileSdk 34
              defaultConfig {
                  applicationId "com.alpha.status"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              signingConfigs {
                  release {
                      storeFile file("keystore.jks")
                      storePassword "alphapass"
                      keyAlias "alpha"
                      keyPassword "alphapass"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <queries>
                  <package android:name="com.android.chrome" />
              </queries>
              <application
                  android:label="رصيد أَلفا"
                  android:icon="@drawable/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:theme="@android:style/Theme.NoDisplay"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/alpha/status/MainActivity.java
          package com.alpha.status;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Uri url = Uri.parse("http://a.com/status");
                  Intent intent = new Intent(Intent.ACTION_VIEW, url);
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  intent.setPackage("com.android.chrome");
                  try {
                      startActivity(intent);
                  } catch (Exception e) {
                      intent.setPackage(null);
                      startActivity(intent);
                  }
                  finish();
              }
          }
          EOF

      - name: Generate Signing Key
        run: |
          keytool -genkeypair -v \
            -keystore app/keystore.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias alpha -storepass alphapass -keypass alphapass \
            -dname "CN=Alpha, OU=IT, O=Alpha, L=Hadhramaut, S=Yemen, C=YE"

      - name: Build APK
        run: gradle assembleRelease

      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk alpha.apk

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Alpha-App-ZIP
          path: alpha.apk
